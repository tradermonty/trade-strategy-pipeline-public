[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trade-strategy-pipeline"
version = "0.1.0"
description = "Pharmaceutical-style stage-gate pipeline for systematic trade strategy development"
requires-python = ">=3.12"
license = {text = "MIT"}
readme = "README.md"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "duckdb>=0.9",
    "numpy>=1.26",
    "vectorbt>=0.26",
    "alpaca-py>=0.21",
    "httpx>=0.25",
    "pandas-market-calendars>=4.0",
    "matplotlib>=3.8",
    "lxml>=6.0.2",
    "html5lib>=1.1",
    "beautifulsoup4>=4.14.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "ruff>=0.3",
    "mypy>=1.8",
    "pandas-stubs>=2.0",
    "types-PyYAML>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "online: marks tests that require external API access (deselected in CI_OFFLINE mode)",
]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src/pipeline"]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "raise NotImplementedError",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "vectorbt.*",
    "duckdb.*",
    "alpaca.*",
    "pandas_market_calendars.*",
]
ignore_missing_imports = true
